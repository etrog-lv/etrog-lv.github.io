<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ניהול בקשות יציאה · קורס אתרוג ל״ו</title>
<link rel="icon" href="/favicon-32.png?v=8"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="robots" content="noindex"><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f5f7fa,#e8ecf3);margin:0;min-height:100vh;color:#1c2430;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
header{display:flex;align-items:center;gap:10px;margin:6px 0 14px}header img{width:44px;height:44px;border-radius:10px}header h1{font-size:19px;margin:0;line-height:1.2}header small{display:block;color:#657080;font-weight:400;font-size:13px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.07);margin-bottom:12px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}label small{font-weight:400;color:#657080}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #d3dae4;border-radius:11px;background:#fff;color:inherit}textarea{min-height:104px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2f6fed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;background:#2f6fed;color:#fff;width:100%;margin-top:14px;cursor:pointer}button.sec{background:#e6ebf3;color:#1c2430}button.ok{background:#1f9d55}button.no{background:#d64545}button.sm{width:auto;padding:8px 12px;margin:0;font-size:14px}button:disabled{opacity:.5}
.err{color:#c0392b;font-size:14px;margin-top:10px;min-height:1px}.muted{color:#657080;font-size:14px}.hide{display:none!important}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}.b-pend{background:#fff3cd;color:#8a6200}.b-ok{background:#d6f5e3;color:#14703a}.b-no{background:#fbdcdc;color:#a02323}.b-urg{background:#ffe0d0;color:#b24400}.b-g{background:#e4defa;color:#4a2fb0}.b-b{background:#dbeafe;color:#1d4fa8}.b-o{background:#ffe9c7;color:#8a5200}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid #eef1f6}.item:last-child{border:0}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{margin:0;background:#e6ebf3;color:#1c2430;padding:10px 6px;font-size:14px}.tabs button.on{background:#2f6fed;color:#fff}
.k{color:#657080;font-size:13px;margin-top:8px}.v{white-space:pre-wrap;word-break:break-word}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:9}.sheet>div{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}
.note{background:#eef4ff;border-radius:12px;padding:11px 13px;font-size:14px;margin-top:10px}

.row2>*{min-width:0}input,select,textarea{min-width:0;max-width:100%}input[type=datetime-local],input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:48px;display:block}#out{width:auto;flex:0 0 auto;padding:10px 14px}.v,.muted,.item span{unicode-bidi:plaintext}
</style><link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%D7%A0%D7%99%D7%94%D7%95%D7%9C%20%D7%91%D7%A7%D7%A9%D7%95%D7%AA%20%D7%99%D7%A6%D7%99%D7%90%D7%94%22%2C%22short_name%22%3A%22%D7%91%D7%A7%D7%A9%D7%95%D7%AA%20%D7%99%D7%A6%D7%99%D7%90%D7%94%22%2C%22display%22%3A%22standalone%22%2C%22dir%22%3A%22rtl%22%2C%22lang%22%3A%22he%22%2C%22start_url%22%3A%22/exit-requests-admin/%22%2C%22scope%22%3A%22/exit-requests-admin/%22%2C%22background_color%22%3A%22%23f5f7fa%22%2C%22theme_color%22%3A%22%232f6fed%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22/icon-192.png%3Fv%3D8%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image/png%22%7D%5D%7D%0A"></head><body><div class="wrap">
<header><img src="/logo.png?v=8" alt=""><h1>ניהול בקשות יציאה<small>רמ״גים בלבד</small></h1></header>
<div id="login" class="card"><label for="who">שם</label><select id="who"></select><label for="pw">סיסמה</label><input type="password" id="pw" autocomplete="current-password"><div class="err" id="err"></div><button id="in">כניסה</button></div>
<div id="app" class="hide"><div class="tabs"><button id="t1" class="on">ממתינות</button><button id="t2">הוכרעו</button><button id="out" style="flex:0 0 auto">יציאה</button></div><div id="pushbox"></div><div id="list"></div></div>
<div id="sheet" class="sheet hide"><div id="sh"></div></div></div>
<script>const API='https://etrog-course-ops.mqog1v.workers.dev';
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={},tok){const h={'Content-Type':'application/json'};if(tok)h.Authorization='Bearer '+tok;const r=await fetch(API+p,{...o,headers:h,body:o.body?JSON.stringify(o.body):undefined});let j={};try{j=await r.json()}catch{}if(!r.ok){const e=new Error(j.error||'שגיאה');e.status=r.status;throw e}return j}
function b64uToU8(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s);return Uint8Array.from(r,c=>c.charCodeAt(0))}
function pushSupport(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return ios&&!standalone?'ios-home':'none';return 'ok'}
async function enablePush(swPath){const reg=await navigator.serviceWorker.register(swPath);await navigator.serviceWorker.ready;const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('לא אושרו התראות');const {key}=await api('/api/vapid');let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(key)});return sub.toJSON()}
const fmt=ep=>new Intl.DateTimeFormat('he-IL',{timeZone:'Asia/Jerusalem',dateStyle:'short',timeStyle:'short'}).format(new Date(ep));
const LOGO='/logo.png?v=8';
</script><script>
let TOK=localStorage.getItem('exit_adm_tok'),ME=localStorage.getItem('exit_adm_name'),TAB='pend',REQ=[];
(async()=>{const u=await api('/api/users');$('#who').innerHTML=u.managers.map(n=>`<option>${esc(n)}</option>`).join('');if(TOK)start()})();
$('#in').onclick=async()=>{$('#err').textContent='';try{const j=await api('/api/login',{method:'POST',body:{role:'manager',name:$('#who').value,password:$('#pw').value}});TOK=j.token;ME=j.name;localStorage.setItem('exit_adm_tok',TOK);localStorage.setItem('exit_adm_name',ME);$('#pw').value='';start()}catch(e){$('#err').textContent=e.message}};
$('#out').onclick=()=>{localStorage.removeItem('exit_adm_tok');location.reload()};$('#t1').onclick=()=>{TAB='pend';tabs()};$('#t2').onclick=()=>{TAB='done';tabs()};
function tabs(){$('#t1').className=TAB==='pend'?'on':'';$('#t2').className=TAB==='done'?'on':'';draw()}
async function start(){$('#login').classList.add('hide');$('#app').classList.remove('hide');await load();pushUI()}
async function load(){try{REQ=(await api('/api/m/requests',{},TOK)).requests;draw()}catch(e){if(e.status===401||e.status===403){localStorage.removeItem('exit_adm_tok');location.reload()}else $('#list').innerHTML='<div class="card err">'+esc(e.message)+'</div>'}}
function pushUI(){const s=pushSupport();const b=$('#pushbox');if(s==='ok')b.innerHTML='<button class="sec" id="pb" style="margin:0 0 12px">הפעלת התראות למכשיר הזה</button><div class="err" id="pe"></div>';else if(s==='ios-home')b.innerHTML='<div class="note" style="margin:0 0 12px">לקבלת התראות באייפון: שיתוף ← ״הוסף למסך הבית״, ואז פתיחה מהאייקון ואישור התראות.</div>';
 if($('#pb'))$('#pb').onclick=async()=>{try{const sub=await enablePush('sw.js');await api('/api/push/sub-staff',{method:'POST',body:{sub}},TOK);$('#pb').textContent='התראות הופעלו ✓';$('#pb').disabled=true}catch(e){$('#pe').textContent=e.message}}}
const ST={pending:['ממתינה','b-pend'],approved:['אושרה','b-ok'],denied:['לא אושרה','b-no']};
function draw(){const L=REQ.filter(r=>TAB==='pend'?r.status==='pending':r.status!=='pending').sort((a,b)=>TAB==='pend'?(b.urgent-a.urgent||a.startEp-b.startEp):b.decidedAt-a.decidedAt);
 $('#list').innerHTML=L.length?L.map(r=>`<div class="card" data-id="${r.id}" style="cursor:pointer"><div class="item" style="border:0;padding:0"><b>${esc(r.name)}</b><span><span class="badge ${ST[r.status][1]}">${esc(r.label||ST[r.status][0])}</span>${r.urgent&&r.status==='pending'?' <span class="badge b-urg">דחוף</span>':''}</span></div><div class="muted">${esc(r.when)}</div><div class="muted">צוות: ${esc(r.team)}${r.decidedBy?' · '+esc(r.decidedBy):''}</div></div>`).join(''):'<div class="card muted">אין בקשות</div>';
 $('#list').onclick=e=>{const c=e.target.closest('[data-id]');if(c)open(c.dataset.id)}}
function open(id){const r=REQ.find(x=>x.id===id);$('#sheet').classList.remove('hide');
 $('#sh').innerHTML=`<b style="font-size:18px">${esc(r.name)}</b> <span class="badge ${ST[r.status][1]}">${esc(r.label||ST[r.status][0])}</span>${r.urgent?' <span class="badge b-urg">דחוף</span>':''}<div class="k">צוות</div><div class="v">${esc(r.team)}</div><div class="k">תאריך ושעות</div><div class="v">${esc(r.when)}</div><div class="k">נוסח בקשת היציאה</div><div class="v">${esc(r.text)}</div><div class="k">דרכי הגעה וחזרה</div><div class="v">${esc(r.travel)}</div>${r.decidedBy?`<div class="k">הוחלט ע״י ${esc(r.decidedBy)}</div>`:''}
 <label for="nt">הערה למגיש/ה <small>(לא חובה)</small></label><input id="nt" value="${esc(r.note||'')}"><div class="err" id="se"></div><div class="row2"><button class="ok" id="ap">אישור</button><button class="no" id="dn">אי אישור</button></div><button class="sec" id="cl">סגירה</button>`;
 const dec=async d=>{$('#ap').disabled=$('#dn').disabled=true;try{const j=await api('/api/m/decide',{method:'POST',body:{id,decision:d,note:$('#nt').value}},TOK);const i=REQ.findIndex(x=>x.id===id);REQ[i]=j.request;$('#sheet').classList.add('hide');draw()}catch(e){$('#se').textContent=e.message;$('#ap').disabled=$('#dn').disabled=false}};
 $('#ap').onclick=()=>dec('approved');$('#dn').onclick=()=>dec('denied');$('#cl').onclick=()=>$('#sheet').classList.add('hide')}
</script></body></html>
