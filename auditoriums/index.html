<style>
:root{--ink:#202739;--muted:#737c8e;--line:#e6e9f1;--blue:#4863da;--glass:rgba(255,255,255,.88);--shilo:#f7e6c8;--shilo-t:#8a6420;--negev:#b9791d;--negev-t:#fff}
*{box-sizing:border-box}
body{margin:0;background:#f6f7fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;z-index:-1;inset:0;background:radial-gradient(ellipse at 85% 0%,#e4e9ff 0,transparent 47%),radial-gradient(ellipse at 0% 40%,#f7eedd 0,transparent 40%)}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:820px;margin:auto;padding:22px max(16px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header a{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.logo{width:42px;height:48px;object-fit:contain}
.brand{font-size:14px;font-weight:700}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}
h1{font-size:clamp(26px,6vw,38px);letter-spacing:-1px;line-height:1.2;margin:0 0 6px;font-weight:750}
.sub{font-size:13px;color:var(--muted);margin:0 0 18px}
.next{border:1px solid #fff;background:var(--glass);box-shadow:0 12px 40px #27345510;border-radius:22px;padding:18px 20px;margin-bottom:16px}
.next .lbl{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:4px}
.next .t{font-size:20px;font-weight:750;line-height:1.3}
.next .m{font-size:13px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:30px;padding:8px 15px;font-size:13px;min-height:40px}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.month{font-size:13px;font-weight:700;color:var(--muted);margin:20px 4px 8px}
.card{border:1px solid #fff;background:var(--glass);box-shadow:0 6px 24px #27345508;border-radius:18px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:62px 1fr;gap:14px}
.card.past{opacity:.55}
.day{text-align:center;border-radius:14px;background:#eef1ff;padding:8px 2px;align-self:start}
.card.past .day{background:#e3f2ea}
.day b{display:block;font-size:24px;line-height:1.1}.day span{font-size:11px;color:var(--muted)}
.ttl{font-size:16px;font-weight:700;margin:0 0 6px;line-height:1.35}
.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:#4b5468}
.chip{display:inline-block;border-radius:30px;padding:2px 11px;font-size:12px;font-weight:700}
.chip.shilo{background:var(--shilo);color:var(--shilo-t)}.chip.negev{background:var(--negev);color:var(--negev-t)}
.time{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.hl{background:#fff3a3;border-radius:6px;padding:0 5px}
.contact{margin-top:8px;font-size:13px}
.contact a{color:var(--blue);text-decoration:none;font-weight:600;direction:ltr;unicode-bidi:isolate}
.flag{font-size:11px;color:var(--muted)}
.done{font-size:11px;color:#2f7a55;font-weight:700}
.foot{font-size:12px;color:var(--muted);margin:24px 4px 0;line-height:1.7}
.empty{text-align:center;color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<main>
<header><a href="/"><img class="logo" src="/logo.png" alt="סמל קורס אתרוג"><div class="brand">קורס אתרוג מגמת תמ״א<small>מחזור ל״ו</small></div></a></header>

<p class="foot">לפי צילום הטבלה מ־25/11/2026 16:42. ינואר ופברואר 2027 לפי אישור.</p>
</main>
<script>

var MN=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
var WD=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
function nowIL(){var p=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Jerusalem",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date());return p.replace(" ","T")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var E=D.map(function(r){var d=new Date(r[0]+"T12:00:00Z");return{iso:r[0],shown:r[1],hall:r[2],a:r[3],b:r[4],t:r[5],n:r[6],ph:r[7],ppl:r[8],hl:r[9],wd:WD[d.getUTCDay()],day:+r[0].slice(8),m:+r[0].slice(5,7)-1,y:r[0].slice(0,4)}});
var filter="up";
function isPast(e,now){return !yr(e)&&(e.iso+"T"+e.b)<=now}
function yr(e){return e.hl.indexOf('yr')>=0}
function fmt(e){return e.day+"/"+(e.m+1)+" · יום "+e.wd}
function render(){
 var now=nowIL(),up=E.filter(function(e){return!yr(e)&&!isPast(e,now)});

 var L=E.filter(function(e){var p=isPast(e,now);if(filter=="yr")return yr(e);if(yr(e)&&filter=="up")return false;return filter=="all"||(filter=="up"&&!p)||(filter=="past"&&p)||filter==e.hall});
 var h="",cur="";
 L.forEach(function(e){
  var k=yr(e)?'yr':e.y+"-"+e.m;if(k!=cur){cur=k;h+='<div class="month">'+(yr(e)?'שנה לא מאושרת (השנה בצילום 2026)':MN[e.m]+" "+e.y)+'</div>'}
