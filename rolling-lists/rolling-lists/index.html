<style>
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: linear-gradient(135deg,#f5f7fa,#e8ecf3); min-height: 100vh; margin: 0; color: #0f172a; }
.hidden { display: none !important; }

/* lock screen */
#lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.lock-card { background: #fff; border-radius: 20px; padding: 32px 28px 36px; box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center; max-width: 420px; width: 100%; }
.badge { display:inline-flex; align-items:center; justify-content:center; width:88px; height:88px; border-radius:50%; margin-bottom:12px; background: rgba(255,255,255,.55); border: 1px solid rgba(100,116,180,.18); box-shadow: 0 8px 22px rgba(100,116,180,.16); }
.badge img { width:74px; height:74px; object-fit:contain; display:block; }
.lock-card h2 { color: #7c3aed; margin: 0 0 4px; font-size: 18px; font-weight: 700; }
.lock-card h1 { color: #7c3aed; margin: 0 0 6px; font-size: 25px; }
.lock-card p { color: #64748b; margin: 0 0 20px; font-size: 14px; }
#pw { width: 100%; padding: 13px 14px; font-size: 17px; border: 1.5px solid #e2e8f0; border-radius: 12px; text-align: center; outline: none; }
#pw:focus { border-color: #7c3aed; }
#unlockBtn { width: 100%; margin-top: 12px; background: #7c3aed; color: #fff; border: 0; padding: 13px; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; }
#unlockBtn:active { transform: scale(.98); }
#lockErr { color: #be123c; font-size: 14px; margin-top: 10px; min-height: 18px; }
#unlockBtn[disabled] { opacity: .6; }

/* app */
header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid #e8ecf3; }
.hbar { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.hbar img { width: 34px; height: 34px; object-fit: contain; }
.htitles { flex: 1; min-width: 0; }
.htitles .t1 { font-weight: 800; font-size: 16px; color: #7c3aed; }
.htitles .t2 { font-size: 11.5px; color: #64748b; }
#lockOut { border: 1px solid #e2e8f0; background: #fff; border-radius: 10px; padding: 7px 10px; font-size: 13px; color: #475569; cursor: pointer; white-space: nowrap; }
main { max-width: 560px; margin: 0 auto; padding: 14px 14px 60px; }
#search { width: 100%; padding: 12px 14px; font-size: 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #fff; outline: none; margin-bottom: 6px; }
#search:focus { border-color: #7c3aed; }
#summary { font-size: 12.5px; color: #64748b; margin: 4px 2px 12px; }
.card { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.06); margin-bottom: 12px; overflow: hidden; }
.card-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: none; border: 0; text-align: right; cursor: pointer; font-family: inherit; }
.card-head .ttl { flex: 1; min-width: 0; }
.card-head .name { font-weight: 700; font-size: 15.5px; color: #0f172a; }
.card-head .meta { font-size: 12px; color: #64748b; margin-top: 3px; }
.chev { color: #94a3b8; font-size: 13px; transition: transform .15s; }
.card.open .chev { transform: rotate(180deg); }
.card-body { display: none; border-top: 1px solid #f1f5f9; padding: 4px 16px 12px; }
.card.open .card-body { display: block; }
.item { padding: 8px 2px; font-size: 15px; border-top: 1px solid #f8fafc; line-height: 1.45; }
.item:first-child { border-top: 0; }
.item.gh { font-weight: 700; color: #7c3aed; font-size: 13.5px; padding-top: 12px; }
mark { background: #fef08a; border-radius: 3px; padding: 0 1px; }
#nores { text-align: center; color: #64748b; padding: 30px 0; font-size: 14.5px; }
footer { text-align: center; color: #94a3b8; font-size: 11.5px; margin-top: 22px; line-height: 1.7; }
</style>

<script>
const $ = (s) => document.querySelector(s);
const b64toU8 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let DATA = null;

async function unlock(pw) {
  const p = JSON.parse($('#payload').textContent);
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64toU8(p.salt), iterations: 600000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64toU8(p.iv) }, key, b64toU8(p.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function isGroupHeader(line) {
  return line.length <= 30 && /[-:־]$/.test(line);
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(filter) {
  const q = (filter || '').trim();
  const cards = $('#cards');
  cards.innerHTML = '';
  let shown = 0;
  for (const lst of DATA.lists) {
    let itemsHtml = '';
    let matchCount = 0;
    for (const raw of lst.items) {
      const hit = q && raw.includes(q);
      if (q && !hit && !lst.title.includes(q)) continue;
      if (hit) matchCount++;
      let txt = esc(raw);
      if (q) txt = txt.split(esc(q)).join('<mark>' + esc(q) + '</mark>');
      itemsHtml += '<div class="item' + (isGroupHeader(raw) ? ' gh' : '') + '">' + txt + '</div>';
    }
    if (q && !lst.title.includes(q) && matchCount === 0) continue;
    shown++;
    const card = document.createElement('div');
    card.className = 'card' + (q ? ' open' : '');
    card.innerHTML =
      '<button class="card-head">' +
        '<span class="ttl"><span class="name">' + esc(lst.title) + '</span>' +
        '<span class="meta">עודכן ' + lst.updated + ' · ' + lst.items.length + ' פריטים</span></span>' +
        '<span class="chev">▼</span>' +
      '</button>' +
      '<div class="card-body">' + itemsHtml + '</div>';
    card.querySelector('.card-head').addEventListener('click', () => card.classList.toggle('open'));
    cards.appendChild(card);
  }
  $('#nores').classList.toggle('hidden', shown > 0);
  $('#summary').textContent = q
    ? shown + ' רשימות תואמות'
    : DATA.lists.length + ' רשימות · נשמרת הגרסה האחרונה של כל רשימה';
}

async function doUnlock(pw) {
  $('#lockErr').textContent = '';
  $('#unlockBtn').disabled = true;
  $('#unlockBtn').textContent = 'פותח…';
  try {
    DATA = await unlock(pw);
    sessionStorage.setItem('rl_pw', pw);
    $('#lock').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#foot').textContent = 'מקור: קבוצת הווטסאפ ״רשימות מתגלגלות ל״ו״ · מצגת מ-' + DATA.snapshot;
    render('');
    $('#search').focus();
  } catch (e) {
    $('#lockErr').textContent = 'סיסמה שגויה, נסו שוב';
  }
  $('#unlockBtn').disabled = false;
  $('#unlockBtn').textContent = 'פתיחה';
}

$('#unlockBtn').addEventListener('click', () => { const v = $('#pw').value; if (v) doUnlock(v); });
$('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.value) doUnlock(e.target.value); });
$('#search').addEventListener('input', (e) => render(e.target.value));
$('#lockOut').addEventListener('click', () => { sessionStorage.removeItem('rl_pw'); location.reload(); });

const saved = sessionStorage.getItem('rl_pw');
if (saved) doUnlock(saved);
</script>
</body>
