function isGroupHeader(line) {
  return line.length <= 30 && /[-:־]$/.test(line);
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(filter, openTitle) {
  const q = (filter || '').trim();
  const cards = $('#cards');
  cards.innerHTML = '';
  let shown = 0;
  for (const lst of DATA.lists) {
    if (ARCH.has(lst.title)) continue;
    let itemsHtml = '';
    let matchCount = 0;
    for (const raw of lst.items) {
      const hit = q && raw.includes(q);
      if (q && !hit && !lst.title.includes(q)) continue;
      if (hit) matchCount++;
      let txt = esc(raw);
      if (q) txt = txt.split(esc(q)).join('<mark>' + esc(q) + '</mark>');
      itemsHtml += '<div class="item' + (isGroupHeader(raw) ? ' gh' : '') + '">' + txt + '</div>';
    }
    if (q && !lst.title.includes(q) && matchCount === 0) continue;
    shown++;
    const card = document.createElement('div');
    card.className = 'card' + ((q || lst.title === openTitle) ? ' open' : '');
    card.innerHTML =
      '<button class="card-head">' +
        '<span class="ttl"><span class="name">' + esc(lst.title) + (lst.custom ? '<span class="newtag">חדשה</span>' : '') + '</span>' +
        '<span class="meta">' + (lst.custom ? 'נוצרה ' : 'עודכן ') + lst.updated + ' · ' + lst.items.length + ' פריטים</span></span>' +
        '<span class="chev">▼</span>' +
      '</button>' +
      '<div class="card-body">' + itemsHtml +
        '<div class="addrow"><input type="text" list="roster-names" placeholder="הוספת חניך/ה מרשימת השמות…" aria-label="שם החניך/ה להוספה"><button type="button">הוספה</button></div>' +
        '<div class="addmsg"></div>' +
        (lst.items.length ? '' : '<div class="emptyl">הרשימה עדיין ריקה. אפשר להוסיף חניכים מרשימת השמות.</div>') +
        '<div class="archrow"><button type="button" class="archbtn">העברה לארכיון</button></div></div>';
    card.querySelector('.card-head').addEventListener('click', () => card.classList.toggle('open'));
    const addBtn = card.querySelector('.addrow button');
    const addInp = card.querySelector('.addrow input');
    const addMsg = card.querySelector('.addmsg');
    addBtn.addEventListener('click', () => addItem(lst, addInp, addBtn, addMsg));
    addInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(lst, addInp, addBtn, addMsg); });
    const ab = card.querySelector('.archbtn'); let abT;
    ab.addEventListener('click', () => {
      if (!ab.classList.contains('confirm')) { ab.classList.add('confirm'); ab.textContent = 'לאשר העברה לארכיון?'; abT = setTimeout(() => { ab.classList.remove('confirm'); ab.textContent = 'העברה לארכיון'; }, 4000); return; }
      clearTimeout(abT); ab.disabled = true; metaAct('archive', lst.title).then((ok) => { if (!ok) { ab.disabled = false; ab.textContent = 'שגיאה, נסו שוב'; ab.classList.remove('confirm'); } });
    });
    cards.appendChild(card);
  }
  $('#nores').classList.toggle('hidden', shown > 0);
  $('#summary').textContent = q
    ? shown + ' רשימות תואמות'
    : (DATA.lists.length - ARCH.size) + ' רשימות · נשמרת הגרסה האחרונה של כל רשימה';
  renderArch();
}

const ARCH = new Set();
function renderArch() {
  const arr = DATA.lists.filter((l) => ARCH.has(l.title));
  $('#archToggle').textContent = 'ארכיון' + (arr.length ? ' (' + arr.length + ')' : '');
  const pnl = $('#archPanel');
  if (!arr.length) { pnl.innerHTML = '<div class="emptyl">אין רשימות בארכיון.</div>'; return; }
  pnl.innerHTML = '';
  for (const l of arr) {
    const row = document.createElement('div'); row.className = 'arow';
    row.innerHTML = '<span class="an">' + esc(l.title) + '<span class="am">' + l.items.length + ' פריטים</span></span><button type="button">שחזור</button>';
    row.querySelector('button').addEventListener('click', (e) => { e.target.disabled = true; metaAct('restore', l.title).then((ok) => { if (!ok) e.target.disabled = false; }); });
    pnl.appendChild(row);
  }
}

const BASE = {};
for (const l of DATA.lists) BASE[l.title] = l.items.slice();
$('#search').addEventListener('input', (e) => render(e.target.value));

const API = 'https://etrog-course-ops.mqog1v.workers.dev';
let ROSTER = [];
function applyMeta(j) {
  ARCH.clear(); for (const t of (j.archived || [])) ARCH.add(t);
  for (const c of (j.custom || [])) {
    if (DATA.lists.some((l) => l.title === c.title)) continue;
    const d = new Date(c.ts).toLocaleDateString('he-IL', { timeZone: 'Asia/Jerusalem', day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '.');
    DATA.lists.unshift({ title: c.title, versions: 1, updated: d, items: [], custom: true });
    BASE[c.title] = [];
  }
}
async function metaAct(action, title) {
  try {
    const r = await fetch(API + '/api/rlmeta', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, title }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'שגיאה בשמירה');
    applyMeta(j); render($('#search').value); return true;
  } catch (e) { return false; }
}
$('#archToggle').addEventListener('click', () => $('#archPanel').classList.toggle('hidden'));
$('#newBtn').addEventListener('click', () => { $('#newPanel').classList.toggle('hidden'); $('#newTitle').focus(); });
async function createList() {
  const t = $('#newTitle').value.trim().replace(/\s+/g, ' '), msg = $('#newMsg'), go = $('#newGo');
  msg.textContent = ''; msg.classList.remove('ok');
  if (!t) return;
  if (DATA.lists.some((l) => l.title === t)) { msg.textContent = 'כבר קיימת רשימה בשם הזה' + (ARCH.has(t) ? ' (בארכיון)' : ''); return; }
  go.disabled = true;
  try {
    const r = await fetch(API + '/api/rlmeta', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'create', title: t }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'שגיאה בשמירה');
    applyMeta(j); $('#newTitle').value = ''; $('#newPanel').classList.add('hidden'); $('#search').value = '';
    render('', t);
  } catch (e) { msg.textContent = e.message || 'שגיאה בשמירה'; }
  go.disabled = false;
}
$('#newGo').addEventListener('click', createList);
$('#newTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter') createList(); });
async function addItem(lst, input, btn, msg) {
  const name = input.value.trim();
  msg.textContent = ''; msg.classList.remove('ok');
  if (!name) return;
  if (!ROSTER.length) { msg.textContent = 'רשימת השמות לא נטענה, נסו שוב בעוד רגע'; return; }
  if (!ROSTER.includes(name)) { msg.textContent = 'בחרו שם מרשימת השמות'; return; }
  if (lst.items.includes(name)) { msg.textContent = 'השם כבר מופיע ברשימה'; return; }
  btn.disabled = true;
  try {
    const r = await fetch(API + '/api/rlists', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ list: lst.title, name, base: BASE[lst.title] || [] }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'שגיאה בשמירה');
    lst.items.push(name);
    render($('#search').value, lst.title);
    for (const c of document.querySelectorAll('.card.open')) {
      if (c.querySelector('.name') && c.querySelector('.name').firstChild.textContent === lst.title) {
        const m = c.querySelector('.addmsg');
        if (m) { m.textContent = 'נוסף ✓'; m.classList.add('ok'); }
        break;
      }
    }
  } catch (e) { msg.textContent = e.message || 'שגיאה בשמירה'; }
  btn.disabled = false;
}
(async function loadExtras() {
  try {
    const r = await fetch(API + '/api/roster'); const j = await r.json(); ROSTER = j.names || [];
    const dl = document.createElement('datalist'); dl.id = 'roster-names';
    dl.innerHTML = ROSTER.map((n) => '<option value="' + esc(n) + '">').join('');
    document.body.appendChild(dl);
  } catch {}
  try { applyMeta(await (await fetch(API + '/api/rlmeta')).json()); } catch {}
  try {
    const r = await fetch(API + '/api/rlists'); const j = await r.json();
    for (const a of (j.adds || [])) {
      const lst = DATA.lists.find((l) => l.title === a.list);
      if (!lst || lst.items.includes(a.name)) continue;
      // An addition belongs to the list version it was made on. If the list's
      // base version changed (newer WhatsApp version replaced it), the addition
      // is superseded and stays hidden rather than silently re-adding the name.
      if (!a.base || JSON.stringify(a.base) !== JSON.stringify(BASE[lst.title])) continue;
      lst.items.push(a.name);
    }
  } catch {}
  render($('#search').value);
})();
$('#foot').textContent = 'מקור: קבוצת הווטסאפ ״רשימות מתגלגלות ל״ו״ · מצגת מ-' + DATA.snapshot;
render('');
</script>
