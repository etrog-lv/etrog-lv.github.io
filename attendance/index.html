<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>בריאות ונוכחות · קורס אתרוג ל״ו</title>
<link rel="icon" href="/favicon-32.png?v=8"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8"><meta name="robots" content="noindex"><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f5f7fa,#e8ecf3);margin:0;min-height:100vh;color:#1c2430;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
header{display:flex;align-items:center;gap:10px;margin:6px 0 14px}header img{width:44px;height:44px;border-radius:10px}header h1{font-size:19px;margin:0;line-height:1.2}header small{display:block;color:#657080;font-weight:400;font-size:13px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.07);margin-bottom:12px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}label small{font-weight:400;color:#657080}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #d3dae4;border-radius:11px;background:#fff;color:inherit}textarea{min-height:104px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2f6fed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;background:#2f6fed;color:#fff;width:100%;margin-top:14px;cursor:pointer}button.sec{background:#e6ebf3;color:#1c2430}button.ok{background:#1f9d55}button.no{background:#d64545}button.sm{width:auto;padding:8px 12px;margin:0;font-size:14px}button:disabled{opacity:.5}
.err{color:#c0392b;font-size:14px;margin-top:10px;min-height:1px}.muted{color:#657080;font-size:14px}.hide{display:none!important}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}.b-pend{background:#fff3cd;color:#8a6200}.b-ok{background:#d6f5e3;color:#14703a}.b-no{background:#fbdcdc;color:#a02323}.b-urg{background:#ffe0d0;color:#b24400}.b-g{background:#e4defa;color:#4a2fb0}.b-b{background:#dbeafe;color:#1d4fa8}.b-o{background:#ffe9c7;color:#8a5200}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid #eef1f6}.item:last-child{border:0}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{margin:0;background:#e6ebf3;color:#1c2430;padding:10px 6px;font-size:14px}.tabs button.on{background:#2f6fed;color:#fff}
.k{color:#657080;font-size:13px;margin-top:8px}.v{white-space:pre-wrap;word-break:break-word}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:9}.sheet>div{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}
.note{background:#eef4ff;border-radius:12px;padding:11px 13px;font-size:14px;margin-top:10px}
</style></head><body><div class="wrap">
<header><img src="/logo.png?v=8" alt=""><h1>בריאות ונוכחות<small>מפקדים בלבד</small></h1></header>
<div id="login" class="card"><div class="tabs"><button id="r1" class="on">מפקד/ת</button><button id="r2">רמ״ג</button></div><label for="who">שם</label><select id="who"></select><label for="pw">סיסמה</label><input type="password" id="pw" autocomplete="current-password"><div class="err" id="err"></div><button id="in">כניסה</button></div>
<div id="app" class="hide">
<div class="card" style="padding:12px"><div class="item" style="border:0;padding:0"><b id="me"></b><button class="sm sec" id="out">יציאה</button></div></div>
<div class="tabs" id="mt"><button id="v1" class="on">נוכחות</button><button id="v2" class="hide">דוח יומי</button></div>
<div class="card" style="padding:12px"><div class="row2"><input type="date" id="day"><input id="q" placeholder="חיפוש שם"></div><div id="sum" class="muted" style="margin-top:8px"></div></div>
<div id="list"></div><div id="rep" class="hide"></div></div>
<div id="sheet" class="sheet hide"><div id="sh"></div></div></div>
<script>const API='https://etrog-course-ops.mqog1v.workers.dev';
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={},tok){const h={'Content-Type':'application/json'};if(tok)h.Authorization='Bearer '+tok;const r=await fetch(API+p,{...o,headers:h,body:o.body?JSON.stringify(o.body):undefined});let j={};try{j=await r.json()}catch{}if(!r.ok){const e=new Error(j.error||'שגיאה');e.status=r.status;throw e}return j}
function b64uToU8(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s);return Uint8Array.from(r,c=>c.charCodeAt(0))}
function pushSupport(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return ios&&!standalone?'ios-home':'none';return 'ok'}
async function enablePush(swPath){const reg=await navigator.serviceWorker.register(swPath);await navigator.serviceWorker.ready;const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('לא אושרו התראות');const {key}=await api('/api/vapid');let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(key)});return sub.toJSON()}
const fmt=ep=>new Intl.DateTimeFormat('he-IL',{timeZone:'Asia/Jerusalem',dateStyle:'short',timeStyle:'short'}).format(new Date(ep));
const LOGO='/logo.png?v=8';
</script><script>
let TOK=sessionStorage.getItem('att_tok'),ROLE=sessionStorage.getItem('att_role'),ME=sessionStorage.getItem('att_name'),USERS=null,DAY=null,D=null,VIEW='att';
const TYP={G:["ג׳",'b-g'],B:["ב׳",'b-b'],other:['אחר','b-o'],exit:['בקשת יציאה','b-o']};
(async()=>{USERS=await api('/api/users');fillWho('commander');if(TOK)enter()})();
function fillWho(r){const l=r==='manager'?USERS.managers:USERS.commanders;$('#who').innerHTML=l.map(n=>`<option>${esc(n)}</option>`).join('');$('#r1').className=r==='commander'?'on':'';$('#r2').className=r==='manager'?'on':'';window.LR=r}
$('#r1').onclick=()=>fillWho('commander');$('#r2').onclick=()=>fillWho('manager');
$('#in').onclick=async()=>{$('#err').textContent='';try{const j=await api('/api/login',{method:'POST',body:{role:window.LR,name:$('#who').value,password:$('#pw').value}});TOK=j.token;ROLE=j.role;ME=j.name;sessionStorage.setItem('att_tok',TOK);sessionStorage.setItem('att_role',ROLE);sessionStorage.setItem('att_name',ME);$('#pw').value='';enter()}catch(e){$('#err').textContent=e.message}};
$('#out').onclick=()=>{sessionStorage.clear();location.reload()};
function enter(){$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#me').textContent=ME+(ROLE==='manager'?' · רמ״ג':'');if(ROLE==='manager')$('#v2').classList.remove('hide');$('#day').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem'}).format(new Date());load()}
$('#day').onchange=()=>load();$('#q').oninput=()=>draw();
$('#v1').onclick=()=>{VIEW='att';views()};$('#v2').onclick=()=>{VIEW='rep';views()};
function views(){$('#v1').className=VIEW==='att'?'on':'';$('#v2').className=VIEW==='rep'?'on':'';$('#list').classList.toggle('hide',VIEW!=='att');$('#rep').classList.toggle('hide',VIEW!=='rep');$('#q').classList.toggle('hide',VIEW!=='att');load()}
async function load(){try{if(VIEW==='rep'){const r=await api('/api/a/report?date='+$('#day').value,{},TOK);$('#sum').textContent='';$('#rep').innerHTML=`<div class="card"><div style="font-size:30px;font-weight:800">${r.present}<span style="font-size:16px;font-weight:500"> נוכחים מתוך ${r.total}</span></div><div class="muted">${r.basis==='now'?'נכון לעכשיו':'לפי היעדרות יום מלא'}</div></div><div class="card"><b>נעדרים (${r.list.length})</b>${r.list.length?r.list.map(x=>`<div class="item"><span>${esc(x.name)}<div class="muted">${esc(x.where)}${x.detail?' · '+esc(x.detail):''}${x.fullDay?'':' · '+esc(x.from)+' עד '+esc(x.to)}${x.commander?' · '+esc(x.commander):''}</div></span></div>`).join(''):'<div class="muted">אין נעדרים</div>'}</div><button class="sec" id="cp">העתקת הדוח כטקסט</button>`;$('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(r.text);$('#cp').textContent='הועתק ✓'};return}
 D=await api('/api/a/day?date='+$('#day').value,{},TOK);draw()}catch(e){if(e.status===401){sessionStorage.clear();location.reload()}else $('#list').innerHTML='<div class="card err">'+esc(e.message)+'</div>'}}
function absOf(n){return D.absences.filter(a=>a.name===n)}
function draw(){if(!D)return;const q=$('#q').value.trim();const names=D.names.filter(n=>!q||n.includes(q));const gone=new Set(D.absences.filter(a=>a.fullDay||true).map(a=>a.name)).size;
 $('#sum').textContent=`${D.names.length} חניכים בצוות שלך${ROLE==='manager'?' (כל הקורס)':''} · ${gone} עם סימון להיום`;
 if(!D.names.length){$('#list').innerHTML='<div class="card muted">אין חניכים משויכים אליך עדיין. השיוך נקבע ע״י הרמ״גים.</div>';return}
 $('#list').innerHTML='<div class="card" style="padding:4px 14px">'+names.map(n=>{const a=absOf(n);return `<div class="item" data-n="${esc(n)}" style="cursor:pointer"><span>${esc(n)}${a.map(x=>`<div class="muted">${esc(x.type==='other'?x.reason||'אחר':x.type==='exit'?'בקשת יציאה מאושרת · '+x.detail:'')}${x.fullDay?'':' '+esc(x.from)+' עד '+esc(x.to)}</div>`).join('')}</span><span>${a.length?a.map(x=>`<span class="badge ${TYP[x.type][1]}">${TYP[x.type][0]}</span>`).join(' '):'<span class="badge b-ok">נוכח/ת</span>'}</span></div>`}).join('')+'</div>';
 $('#list').onclick=e=>{const c=e.target.closest('[data-n]');if(c)sheet(c.dataset.n)}}
function sheet(n){const a=absOf(n);const day=$('#day').value;$('#sheet').classList.remove('hide');
 $('#sh').innerHTML=`<b style="font-size:18px">${esc(n)}</b><div class="muted">${esc(day)}</div>${a.map(x=>`<div class="item"><span><span class="badge ${TYP[x.type][1]}">${TYP[x.type][0]}</span> <span class="muted">${esc(x.from)} עד ${esc(x.to)}${x.by?' · '+esc(x.by):''}</span></span>${x.derived?'<span class="muted">מבקשת יציאה</span>':`<button class="sm no" data-c="${x.id}">הסרה</button>`}</div>`).join('')}
 <label>סימון חדש</label><div class="tabs"><button data-t="G" class="on">ג׳</button><button data-t="B">ב׳ (בחדר, לא בשיעורים)</button><button data-t="other">אחר</button></div>
 <div id="rs" class="hide"><label for="rsn">סיבה / איפה נמצא/ת</label><input id="rsn" maxlength="200"></div>
 <div class="row2"><div><label for="fd">מתאריך</label><input type="date" id="fd" value="${day}"></div><div><label for="td">עד תאריך</label><input type="date" id="td" value="${day}"></div></div>
 <div class="row2"><div><label for="ft">משעה <small>(ריק = כל היום)</small></label><input type="time" id="ft"></div><div><label for="tt">עד שעה</label><input type="time" id="tt"></div></div>
 <div class="err" id="se"></div><button id="sv">שמירה</button><button class="sec" id="cl">סגירה</button>`;
 let T='G';document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{T=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.className=x===b?'on':'');$('#rs').classList.toggle('hide',T!=='other')});
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{try{await api('/api/a/clear',{method:'POST',body:{id:b.dataset.c}},TOK);$('#sheet').classList.add('hide');load()}catch(e){$('#se').textContent=e.message}});
 $('#sv').onclick=async()=>{$('#sv').disabled=true;try{await api('/api/a/mark',{method:'POST',body:{name:n,type:T,reason:$('#rsn').value,fromDate:$('#fd').value,toDate:$('#td').value,fromTime:$('#ft').value,toTime:$('#tt').value}},TOK);$('#sheet').classList.add('hide');load()}catch(e){$('#se').textContent=e.message;$('#sv').disabled=false}};
 $('#cl').onclick=()=>$('#sheet').classList.add('hide')}
</script></body></html>
